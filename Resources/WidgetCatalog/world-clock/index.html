<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"SF Pro Rounded",system-ui;color:#fff;-webkit-user-select:none;cursor:default}
.card{box-sizing:border-box;width:100%;height:100%;border-radius:22px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.row{display:flex;justify-content:space-between;width:210px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1)}.row:last-child{border:0}
.c{font-size:14px;font-weight:600}.d{font-size:11px;opacity:.65}.h{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}</style></head>
<body><div class="card" id="list"></div><script>
const zones=[['New York','America/New_York'],['London','Europe/London'],['Tokyo','Asia/Tokyo']];
function render(){const now=new Date();document.getElementById('list').innerHTML=zones.map(([n,z])=>{
const t=now.toLocaleTimeString([], {timeZone:z,hour:'2-digit',minute:'2-digit'});const d=now.toLocaleDateString([], {timeZone:z,weekday:'short'});
return '<div class="row"><div><div class="c">'+n+'</div><div class="d">'+d+'</div></div><div class="h">'+t+'</div></div>'}).join('');}
render();setInterval(render,10000);</script></body></html>
