<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 840" width="1320" height="840">
  <defs>
    <!-- Deep Obsidian Studio Canvas -->
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111117"/>
      <stop offset="48%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#06060A"/>
    </linearGradient>

    <!-- Soft Blurs -->
    <filter id="auraBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
    <filter id="waveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="arrowGlow" filterUnits="userSpaceOnUse" x="540" y="370" width="240" height="120">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Opposing Silk Wave Gradients (Echoing AppIcon.svg) -->
    <linearGradient id="silkWaveA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="silkWaveB" x1="0" y1="0.4" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="crestLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="28%" stop-color="#C4B5FD" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.44"/>
      <stop offset="78%" stop-color="#7DD3FC" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Frosted Glass Pedestal Fill & Rim -->
    <linearGradient id="socketFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>

    <linearGradient id="socketRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Dark Glass Backdrop -->
  <rect width="1320" height="840" fill="url(#bgCanvas)"/>
  <rect width="1320" height="840" fill="url(#microGrid)"/>

  <!-- Soft Atmospheric Auras Behind Icon Sockets -->
  <ellipse cx="360" cy="430" rx="250" ry="185" fill="#7C3AED" opacity="0.14" filter="url(#auraBlur)"/>
  <ellipse cx="960" cy="430" rx="260" ry="190" fill="#06B6D4" opacity="0.12" filter="url(#auraBlur)"/>

  <!-- Delicate Opposing Silk Waves Across Lower Horizon (Zero Text Collision) -->
  <path d="M -40 695 C 240 615, 480 770, 790 725 C 1020 692, 1180 655, 1360 705 L 1360 880 L -40 880 Z" fill="url(#silkWaveA)" filter="url(#waveBlur)"/>
  <path d="M -40 760 C 260 805, 510 660, 825 695 C 1055 720, 1200 765, 1360 715 L 1360 880 L -40 880 Z" fill="url(#silkWaveB)" filter="url(#waveBlur)"/>
  <path d="M 40 705 C 280 638, 495 765, 790 722 C 1015 688, 1175 660, 1290 696" fill="none" stroke="url(#crestLine)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 40 758 C 280 798, 515 668, 825 698 C 1050 720, 1190 755, 1290 716" fill="none" stroke="url(#crestLine)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Top Brand Header (Safe Top Area: y = 64..156 @2x) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif">
    <text x="660" y="108" fill="#FAFAFA" font-size="44" font-weight="650" letter-spacing="-0.8">Nimbscape</text>
    <text x="660" y="152" fill="#A1A1AA" font-size="22" font-weight="450" letter-spacing="0.1">Drag Nimbscape into Applications to install</text>
  </g>

  <!-- Subtle Hairline Divider Below Header -->
  <line x1="460" y1="186" x2="860" y2="186" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ================================================================
       ICON DROP SOCKETS
       Logical Finder coordinates (660x420 window, icon size 128pt):
         - Nimbscape.app : (180, 215) pt  ->  (360, 430) px @2x
         - Applications  : (480, 215) pt  ->  (960, 430) px @2x
       Finder filename labels sit below at y = 590..635 px @2x (clear dark zone)
       ================================================================ -->

  <!-- Left Socket: Source App (Nimbscape.app) -->
  <rect x="200" y="270" width="320" height="320" rx="72" fill="url(#socketFill)" stroke="url(#socketRim)" stroke-width="2"/>

  <!-- Center Drag Arrow: Single Clean Monochrome SF-Style Arrow (No Pill, No Glow, No Multi-Chevrons) -->
  <g stroke="#E4E4E7" stroke-opacity="0.72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="596" y1="430" x2="722" y2="430"/>
    <path d="M 702 410 L 724 430 L 702 450"/>
  </g>

  <!-- Right Socket: Destination Folder (Applications) — Quiet Monochrome Dashed Drop Zone -->
  <rect x="800" y="270" width="320" height="320" rx="72" fill="url(#socketFill)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="12 10"/>

  <!-- Subtle Bottom Technical Metadata -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    <text x="660" y="794" fill="#71717A" font-size="17" font-weight="500" letter-spacing="0.4">macOS 14+  ·  Apple Silicon  ·  Native Swift</text>
  </g>
</svg>
