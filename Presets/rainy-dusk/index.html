<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainy Glass Dusk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d131c; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const backgroundCanvas = document.createElement('canvas');
    const backgroundContext = backgroundCanvas.getContext('2d');

    let w = 0, h = 0;
    let mx = 0, my = 0, smoothMouseX = 0, smoothMouseY = 0;
    let drops = [];
    let staticBeads = [];

    window.addEventListener('ns-mousemove', (e) => {
      if (e.detail) { mx = e.detail.x || 0; my = e.detail.y || 0; }
    });

    function buildScene() {
      w = canvas.width = backgroundCanvas.width = Math.max(1, window.innerWidth);
      h = canvas.height = backgroundCanvas.height = Math.max(1, window.innerHeight);

      const grad = backgroundContext.createLinearGradient(0, 0, w * 0.2, h);
      grad.addColorStop(0.0, '#0d1522');
      grad.addColorStop(0.45, '#162334');
      grad.addColorStop(0.80, '#1e2c3d');
      grad.addColorStop(1.0, '#101824');
      backgroundContext.fillStyle = grad;
      backgroundContext.fillRect(0, 0, w, h);

      const bokeh = [
        { x: 0.16, y: 0.62, r: 0.14, col: 'rgba(230, 178, 126, 0.14)' },
        { x: 0.28, y: 0.72, r: 0.10, col: 'rgba(130, 178, 224, 0.12)' },
        { x: 0.44, y: 0.56, r: 0.18, col: 'rgba(110, 154, 198, 0.11)' },
        { x: 0.64, y: 0.66, r: 0.13, col: 'rgba(224, 168, 122, 0.15)' },
        { x: 0.78, y: 0.52, r: 0.16, col: 'rgba(140, 182, 218, 0.12)' },
        { x: 0.86, y: 0.76, r: 0.11, col: 'rgba(235, 196, 152, 0.12)' },
        { x: 0.52, y: 0.84, r: 0.15, col: 'rgba(92, 134, 172, 0.10)' }
      ];
      for (const b of bokeh) {
        const bx = b.x * w, by = b.y * h, br = b.r * Math.max(w, h);
        const rg = backgroundContext.createRadialGradient(bx, by, br * 0.08, bx, by, br);
        rg.addColorStop(0, b.col);
        rg.addColorStop(0.65, b.col.replace(/[\d.]+\)$/, '0.03)'));
        rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
        backgroundContext.fillStyle = rg;
        backgroundContext.fillRect(bx - br, by - br, br * 2, br * 2);
      }

      let s = 31337;
      const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      staticBeads = Array.from({ length: 160 }, () => ({
        x: rand() * w,
        y: rand() * h,
        r: 0.9 + rand() * 1.9,
        a: 0.06 + rand() * 0.12
      }));

      for (const b of staticBeads) {
        backgroundContext.beginPath();
        backgroundContext.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        backgroundContext.fillStyle = `rgba(210, 228, 245, ${b.a})`;
        backgroundContext.fill();
      }

      drops = Array.from({ length: 28 }, (_, i) => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 2.2 + Math.random() * 3.0,
        vy: 14 + Math.random() * 26,
        drift: (Math.random() - 0.5) * 3.5,
        trailLen: 36 + Math.random() * 80,
        phase: i * 0.7
      }));
    }

    window.addEventListener('resize', buildScene);
    buildScene();

    let last = performance.now();
    let t = 0;

    function draw(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      const speed = window.__nsSpeed ?? 1.0;
      t += dt * speed;
      smoothMouseX += (mx - smoothMouseX) * 0.04;
      smoothMouseY += (my - smoothMouseY) * 0.04;

      ctx.drawImage(backgroundCanvas, 0, 0);

      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        const wobble = Math.sin(t * 1.4 + d.phase) * 0.45;
        d.y += d.vy * (0.7 + 0.3 * Math.sin(t + d.phase)) * dt * speed;
        d.x += (d.drift + wobble) * dt * speed;

        if (d.y - d.trailLen > h + 20) {
          d.y = -20 - Math.random() * 80;
          d.x = Math.random() * w;
        }

        const px = d.x - smoothMouseX * 10;
        const py = d.y - smoothMouseY * 6;

        const tg = ctx.createLinearGradient(px, py - d.trailLen, px, py);
        tg.addColorStop(0, 'rgba(200, 222, 244, 0)');
        tg.addColorStop(1, 'rgba(200, 222, 244, 0.16)');
        ctx.strokeStyle = tg;
        ctx.lineWidth = d.r * 0.72;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px, py - d.trailLen);
        ctx.lineTo(px, py);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(px, py, d.r * 0.85, d.r * 1.15, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(218, 234, 250, 0.28)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(px - d.r * 0.25, py - d.r * 0.35, d.r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
