<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Floating Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 26% 28%, rgba(59, 130, 246, 0.24) 0%, transparent 45%),
        radial-gradient(circle at 74% 72%, rgba(168, 85, 247, 0.20) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, #151624 0%, #080811 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      user-select: none;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 60px 80px;
      border-radius: 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .time {
      font-size: 8rem;
      font-weight: 200;
      letter-spacing: -2px;
      color: #f3f4f6;
      line-height: 1;
      margin-bottom: 16px;
    }
    .seconds {
      font-size: 3rem;
      opacity: 0.45;
      font-weight: 300;
      margin-left: 8px;
    }
    .date {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #60a5fa;
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="time" id="time">00:00<span class="seconds" id="sec">00</span></div>
    <div class="date" id="date">MONDAY, NOVEMBER 17</div>
  </div>

  <script>
    function updateClock() {
      if (window.__nsPaused) return;
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').innerHTML = `${h}:${m}<span class="seconds" id="sec">${s}</span>`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
