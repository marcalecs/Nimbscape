<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Sound Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1018; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const backgroundCanvas = document.createElement('canvas');
    const backgroundContext = backgroundCanvas.getContext('2d');

    let w = 0, h = 0;
    const BANDS = 64;
    const smooth = new Float32Array(BANDS);
    const target = new Float32Array(BANDS);
    let lastAudioAt = 0;

    if (typeof window.wallpaperRegisterAudioListener === 'function') {
      window.wallpaperRegisterAudioListener((audioArray) => {
        if (!Array.isArray(audioArray) || audioArray.length < BANDS) return;
        lastAudioAt = performance.now();
        for (let i = 0; i < BANDS; i++) {
          const l = Number(audioArray[i]) || 0;
          const r = Number(audioArray[Math.min(audioArray.length - 1, i + BANDS)]) || l;
          target[i] = Math.min(1.0, (l + r) * 0.55);
        }
      });
    }

    function resize() {
      w = canvas.width = backgroundCanvas.width = Math.max(1, window.innerWidth);
      h = canvas.height = backgroundCanvas.height = Math.max(1, window.innerHeight);

      const g = backgroundContext.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0.0, '#0a0e16');
      g.addColorStop(0.55, '#131b29');
      g.addColorStop(1.0, '#0a0f18');
      backgroundContext.fillStyle = g;
      backgroundContext.fillRect(0, 0, w, h);

      const orb = backgroundContext.createRadialGradient(w * 0.5, h * 0.52, 10, w * 0.5, h * 0.52, Math.max(w, h) * 0.45);
      orb.addColorStop(0, 'rgba(130, 162, 212, 0.16)');
      orb.addColorStop(0.55, 'rgba(84, 112, 164, 0.05)');
      orb.addColorStop(1, 'rgba(10, 14, 22, 0)');
      backgroundContext.fillStyle = orb;
      backgroundContext.fillRect(0, 0, w, h);
    }

    window.addEventListener('resize', resize);
    resize();

    let t = 0;
    let last = performance.now();

    function drawWave(midY, ampScale, phaseShift, strokeColor, fillTop) {
      const pts = [];
      for (let i = 0; i < BANDS; i++) {
        const u = i / (BANDS - 1);
        const env = Math.sin(u * Math.PI);
        const x = u * w;
        const val = smooth[i] * env;
        const gentle = Math.sin(u * Math.PI * 3.0 + t * 0.9 + phaseShift) * 10 * env;
        const y = midY - val * h * ampScale + gentle;
        pts.push({ x, y });
      }

      const grad = ctx.createLinearGradient(0, midY - h * 0.22, 0, midY + h * 0.22);
      grad.addColorStop(0, fillTop);
      grad.addColorStop(1, 'rgba(12, 16, 24, 0)');

      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const cx = (pts[i].x + pts[i + 1].x) * 0.5;
        const cy = (pts[i].y + pts[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, cx, cy);
      }
      ctx.lineTo(w, pts[pts.length - 1].y);
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const cx = (pts[i].x + pts[i + 1].x) * 0.5;
        const cy = (pts[i].y + pts[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, cx, cy);
      }
      ctx.lineTo(w, pts[pts.length - 1].y);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    function draw(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      const speed = window.__nsSpeed ?? 1.0;
      t += dt * speed;

      const hasLiveAudio = (now - lastAudioAt) < 1200;
      for (let i = 0; i < BANDS; i++) {
        const idle = hasLiveAudio ? target[i] : (0.14 + 0.12 * Math.sin(t * 0.8 + i * 0.22) + 0.06 * Math.cos(t * 1.2 - i * 0.15));
        smooth[i] += (idle - smooth[i]) * Math.min(1, dt * 8.0);
      }

      ctx.drawImage(backgroundCanvas, 0, 0);

      const midY = h * 0.56;
      drawWave(midY - 8, 0.22, 0.0, 'rgba(182, 206, 238, 0.55)', 'rgba(132, 168, 218, 0.16)');
      drawWave(midY + 6, 0.16, 1.5, 'rgba(148, 186, 216, 0.38)', 'rgba(98, 146, 186, 0.12)');
      drawWave(midY + 20, 0.11, 3.1, 'rgba(164, 172, 218, 0.28)', 'rgba(112, 124, 178, 0.08)');

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
