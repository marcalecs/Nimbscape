<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordic Aurora</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060b14; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const backgroundCanvas = document.createElement('canvas');
    const backgroundContext = backgroundCanvas.getContext('2d');

    let w = 0, h = 0;
    let mx = 0, my = 0, smoothMouseX = 0, smoothMouseY = 0;
    let stars = [];
    let horizonPts = [];

    window.addEventListener('ns-mousemove', (e) => {
      if (e.detail) { mx = e.detail.x || 0; my = e.detail.y || 0; }
    });

    function seeded(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    }

    function buildScene() {
      w = canvas.width = backgroundCanvas.width = Math.max(1, window.innerWidth);
      h = canvas.height = backgroundCanvas.height = Math.max(1, window.innerHeight);

      const g = backgroundContext.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0.0, '#040812');
      g.addColorStop(0.55, '#091525');
      g.addColorStop(0.78, '#0d1e30');
      g.addColorStop(0.80, '#07101c');
      g.addColorStop(1.0, '#040912');
      backgroundContext.fillStyle = g;
      backgroundContext.fillRect(0, 0, w, h);

      const rand = seeded(8821);
      stars = Array.from({ length: 90 }, () => ({
        x: rand() * w,
        y: rand() * h * 0.68,
        r: rand() > 0.8 ? 1.45 : 0.9,
        phase: rand() * Math.PI * 2,
        speed: 0.4 + rand() * 0.8
      }));

      horizonPts = [];
      const steps = 64;
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const elev =
          Math.sin(u * Math.PI * 2.2 + 0.6) * h * 0.048 +
          Math.sin(u * Math.PI * 5.7 + 1.4) * h * 0.022 +
          Math.cos(u * Math.PI * 11.3) * h * 0.008;
        horizonPts.push({ x: u * w, y: h * 0.77 - Math.abs(elev) });
      }
    }

    window.addEventListener('resize', buildScene);
    buildScene();

    let t = 4.0;
    let last = performance.now();

    function drawAuroraCurtain(time, baseY, heightScale, topColor, midColor, botColor, speedMul, phase) {
      const steps = 56;
      const topPts = [];
      const botPts = [];

      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const x = -60 + u * (w + 120) - smoothMouseX * 16;
        const sway =
          Math.sin(u * 4.2 + time * 0.24 * speedMul + phase) * h * 0.075 +
          Math.cos(u * 8.4 - time * 0.16 * speedMul + phase * 1.4) * h * 0.03;
        const yBot = baseY + sway - smoothMouseY * 8;
        const ch = h * heightScale * (0.65 + 0.35 * Math.sin(u * 5.2 + time * 0.32 + phase));
        botPts.push({ x, y: yBot });
        topPts.push({ x, y: yBot - ch });
      }

      const grad = ctx.createLinearGradient(0, baseY - h * heightScale * 1.1, 0, baseY + h * 0.12);
      grad.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
      grad.addColorStop(0.32, topColor);
      grad.addColorStop(0.75, midColor);
      grad.addColorStop(0.92, botColor);
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.beginPath();
      ctx.moveTo(topPts[0].x, topPts[0].y);
      for (let i = 1; i < topPts.length; i++) ctx.lineTo(topPts[i].x, topPts[i].y);
      for (let i = botPts.length - 1; i >= 0; i--) ctx.lineTo(botPts[i].x, botPts[i].y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    function draw(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      const speed = window.__nsSpeed ?? 1.0;
      t += dt * speed;
      smoothMouseX += (mx - smoothMouseX) * 0.035;
      smoothMouseY += (my - smoothMouseY) * 0.035;

      ctx.drawImage(backgroundCanvas, 0, 0);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const a = 0.22 + 0.48 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
        ctx.fillStyle = `rgba(218, 234, 252, ${a.toFixed(3)})`;
        ctx.fillRect(s.x - smoothMouseX * 4, s.y - smoothMouseY * 3, s.r, s.r);
      }

      drawAuroraCurtain(t, h * 0.50, 0.36, 'rgba(62, 118, 198, 0.14)', 'rgba(64, 198, 168, 0.22)', 'rgba(84, 214, 178, 0.08)', 1.0, 0.0);
      drawAuroraCurtain(t, h * 0.56, 0.30, 'rgba(104, 116, 212, 0.12)', 'rgba(72, 186, 174, 0.18)', 'rgba(64, 168, 184, 0.06)', 0.72, 2.2);
      drawAuroraCurtain(t, h * 0.44, 0.28, 'rgba(54, 148, 172, 0.10)', 'rgba(98, 166, 224, 0.14)', 'rgba(84, 198, 182, 0.05)', 0.55, 4.4);

      const lakeY = h * 0.77;
      const refGrad = ctx.createLinearGradient(0, lakeY, 0, h);
      refGrad.addColorStop(0, 'rgba(62, 166, 158, 0.16)');
      refGrad.addColorStop(0.55, 'rgba(26, 62, 92, 0.08)');
      refGrad.addColorStop(1, 'rgba(4, 9, 18, 0)');
      ctx.fillStyle = refGrad;
      ctx.fillRect(0, lakeY, w, h - lakeY);

      ctx.beginPath();
      ctx.moveTo(0, lakeY + 2);
      for (let i = 0; i < horizonPts.length; i++) {
        ctx.lineTo(horizonPts[i].x, horizonPts[i].y);
      }
      ctx.lineTo(w, lakeY + 2);
      ctx.closePath();
      ctx.fillStyle = '#050a12';
      ctx.fill();

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
