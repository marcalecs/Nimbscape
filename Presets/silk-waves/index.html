<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silk Ink Waves</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const backgroundCanvas = document.createElement('canvas');
    const backgroundContext = backgroundCanvas.getContext('2d');

    let w = 0, h = 0;
    let mx = 0, my = 0, smoothMouseX = 0, smoothMouseY = 0;

    window.addEventListener('ns-mousemove', (e) => {
      if (e.detail) { mx = e.detail.x || 0; my = e.detail.y || 0; }
    });

    function resize() {
      w = canvas.width = backgroundCanvas.width = Math.max(1, window.innerWidth);
      h = canvas.height = backgroundCanvas.height = Math.max(1, window.innerHeight);

      const g = backgroundContext.createLinearGradient(0, 0, w, h);
      g.addColorStop(0.0, '#0a0d14');
      g.addColorStop(0.5, '#111827');
      g.addColorStop(1.0, '#0b1019');
      backgroundContext.fillStyle = g;
      backgroundContext.fillRect(0, 0, w, h);

      const glow = backgroundContext.createRadialGradient(w * 0.68, h * 0.35, 20, w * 0.68, h * 0.35, Math.max(w, h) * 0.65);
      glow.addColorStop(0, 'rgba(98, 128, 178, 0.16)');
      glow.addColorStop(0.5, 'rgba(72, 92, 138, 0.06)');
      glow.addColorStop(1, 'rgba(10, 13, 20, 0)');
      backgroundContext.fillStyle = glow;
      backgroundContext.fillRect(0, 0, w, h);
    }

    window.addEventListener('resize', resize);
    resize();

    let t = 2.0;
    let last = performance.now();

    function draw(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      const speed = window.__nsSpeed ?? 1.0;
      t += dt * speed * 0.45;
      smoothMouseX += (mx - smoothMouseX) * 0.04;
      smoothMouseY += (my - smoothMouseY) * 0.04;

      ctx.drawImage(backgroundCanvas, 0, 0);

      const ribbons = [
        { y: 0.42, amp: 0.10, freq: 2.1, phase: 0.0, c1: 'rgba(120, 152, 205, 0.14)', c2: 'rgba(65, 92, 145, 0.02)' },
        { y: 0.56, amp: 0.12, freq: 1.7, phase: 1.8, c1: 'rgba(155, 174, 212, 0.12)', c2: 'rgba(54, 72, 110, 0.02)' },
        { y: 0.70, amp: 0.09, freq: 2.5, phase: 3.6, c1: 'rgba(110, 146, 178, 0.13)', c2: 'rgba(30, 44, 68, 0.02)' }
      ];

      const steps = 48;
      for (let r = 0; r < ribbons.length; r++) {
        const rb = ribbons[r];
        const baseY = h * rb.y - smoothMouseY * (10 + r * 6);
        const grad = ctx.createLinearGradient(0, baseY - h * 0.15, 0, h);
        grad.addColorStop(0, rb.c1);
        grad.addColorStop(0.6, rb.c2);
        grad.addColorStop(1, 'rgba(10, 13, 20, 0)');

        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const x = u * w;
          const y = baseY
            + Math.sin(u * Math.PI * rb.freq + t + rb.phase + smoothMouseX * 0.4) * h * rb.amp
            + Math.cos(u * Math.PI * (rb.freq * 1.8) - t * 0.65 + rb.phase) * h * (rb.amp * 0.35);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }

      const lines = 11;
      ctx.lineWidth = 1.1;
      for (let l = 0; l < lines; l++) {
        const frac = l / (lines - 1);
        const baseY = h * (0.24 + frac * 0.58) - smoothMouseY * (6 + frac * 10);
        const alpha = 0.06 + Math.sin(frac * Math.PI) * 0.14;
        ctx.strokeStyle = `rgba(185, 204, 232, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const x = u * w;
          const y = baseY
            + Math.sin(u * Math.PI * 2.2 + t * 0.85 + frac * 1.4 + smoothMouseX * 0.35) * h * 0.065
            + Math.cos(u * Math.PI * 4.0 - t * 0.5 + frac * 2.1) * h * 0.022;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
